<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>%%TITLE%%</title>
%%FONTS%%
<style>
  /* Les couleurs et polices viennent de marque.json (bloc ajouté en bas du style par build.py). */
  :root { --blue:#0A77BD; --navy:#13253F; --ink:#0E1621; --mute:#5B6676; --line:#DCE6F0; --tint:#EEF5FB; }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: var(--police-texte), sans-serif; color: var(--ink); background:#fff; font-size: 12pt; line-height: 1.5; }
  .page { width: 210mm; height: 297mm; overflow: hidden; padding: 20mm 20mm 22mm; position: relative; page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  .foot { position:absolute; bottom: 10mm; left: 20mm; right: 20mm; display:flex; justify-content:space-between; font-size: 8pt; color: var(--mute); border-top: 1px solid var(--line); padding-top: 3mm; letter-spacing: .08em; text-transform: uppercase; }
  .foot b { color: var(--navy); } .foot span.b { color: var(--blue); font-weight:700; }
  h1, h2 { font-family: var(--police-titre), sans-serif; color: var(--navy); margin: 0; }
  h1 { font-size: 30pt; font-weight: 800; line-height: 1.08; letter-spacing: -.02em; margin-bottom: 4mm; }
  h1 span { color: var(--blue); }
  h2 { font-size: 20pt; font-weight: 800; line-height: 1.15; margin-bottom: 3mm; }
  h2 span { color: var(--blue); }
  .kicker { font-family: var(--police-titre), sans-serif; font-weight: 700; font-size: 9.5pt; letter-spacing: .25em; text-transform: uppercase; color: var(--blue); margin-bottom: 2mm; }
  .lead { font-size: 12.5pt; color: var(--mute); margin: 0 0 6mm; }
  .toplogo { height: 12mm; margin-bottom: 6mm; }

  table { width:100%; border-collapse: collapse; font-size: 10pt; margin-bottom: 6mm; }
  td.f { white-space: nowrap; }
  th { text-align:left; font-family: var(--police-titre), sans-serif; font-size: 8pt; letter-spacing:.15em; text-transform:uppercase; color:#fff; background: var(--navy); padding: 2.6mm 3mm; }
  td { padding: 2mm 2.5mm; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.n { font-family: var(--police-titre), sans-serif; font-weight: 800; color: var(--blue); width: 8mm; }
  td img { width: 8mm; height: 8mm; border-radius: 1mm; vertical-align: middle; margin-right: 2mm; }
  td.ck { font-weight: 700; color: var(--navy); white-space: nowrap; }
  .job { font-size: 8pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: .6mm 2mm; border-radius: 2mm; background: var(--tint); color: var(--blue); }
  .job.v { background: var(--blue); color: #fff; }
  .job.f { background: #F1F3F6; color: var(--navy); }

  .check { list-style: none; padding: 0; margin: 0; }
  .check li { padding: 2.4mm 0 2.4mm 10mm; position: relative; border-bottom: 1px solid var(--line); font-size: 11.5pt; }
  .check li::before { content:""; position:absolute; left:0; top: 3.2mm; width: 5mm; height: 5mm; border: 2px solid var(--blue); border-radius: 1mm; }
  .tip { background: var(--tint); border-left: 5px solid var(--blue); padding: 4mm 6mm; border-radius: 0 3mm 3mm 0; margin-top: 6mm; font-size: 11pt; }
  .tip b { color: var(--navy); }

  /* script court */
  .shead { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 5mm; }
  .shead img { width: 16mm; height: 16mm; border-radius: 1.5mm; }
  .meta { display:flex; flex-wrap: wrap; gap: 2.5mm; margin-top: 2mm; }
  .tag { background: var(--tint); color: var(--navy); font-weight: 600; font-size: 9.5pt; padding: 1.2mm 3.5mm; border-radius: 10mm; }
  .screen { background: var(--navy); color:#fff; font-family: var(--police-titre), sans-serif; font-weight: 800; font-size: 19pt; text-align:center; border-radius: 3mm; padding: 6mm; margin-bottom: 6mm; line-height: 1.2; }
  .screen small { display:block; font-family: var(--police-texte), sans-serif; font-weight: 500; font-size: 8.5pt; letter-spacing: .2em; text-transform: uppercase; color:rgba(255,255,255,.72); margin-bottom: 2mm; }
  .hookline { font-family: var(--police-titre), sans-serif; font-weight: 700; color: var(--navy); font-size: 14.5pt; line-height: 1.35; margin-bottom: 6mm; }
  .hookline small { display:block; font-family: var(--police-texte), sans-serif; font-weight: 600; font-size: 8.5pt; letter-spacing: .2em; text-transform: uppercase; color: var(--blue); margin-bottom: 1.5mm; }
  .pts { counter-reset: p; list-style: none; padding: 0; margin: 0 0 2mm; }
  .pts li { counter-increment: p; position: relative; padding: 0 0 0 11mm; margin-bottom: 4mm; font-size: 12.5pt; }
  .pts li::before { content: counter(p); position:absolute; left:0; top: 0; width: 7mm; height: 7mm; border-radius: 50%; background: var(--blue); color:#fff; font-family: var(--police-titre), sans-serif; font-weight: 800; font-size: 10pt; display:flex; align-items:center; justify-content:center; }
  .end { border-top: 2px solid var(--blue); padding-top: 4mm; margin-top: 5mm; font-family: var(--police-titre), sans-serif; font-weight: 800; font-size: 15pt; color: var(--navy); line-height: 1.3; }
  .end span { color: var(--blue); }
  .cta { background: var(--tint); border-radius: 3mm; padding: 4mm 6mm; font-size: 12.5pt; margin-top: 5mm; }
  .cta b { color: var(--blue); font-family: var(--police-titre), sans-serif; letter-spacing: .12em; font-size: 8.5pt; text-transform: uppercase; display:block; margin-bottom: 1mm; }
  .fill { background:#FFF6D9; padding: 0 1.5mm; border-radius: 1mm; }
  .warn { margin-top: 4mm; font-size: 10.5pt; background:#FFF6D9; border-radius: 2mm; padding: 3mm 5mm; }
  .src { position:absolute; bottom: 19mm; left: 20mm; right: 20mm; font-size: 8.5pt; color: var(--mute); line-height: 1.4; }

  /* script long (YouTube) */
  .titres { margin: 0 0 5mm; padding: 0; list-style: none; }
  .titres li { font-family: var(--police-titre), sans-serif; font-weight: 700; color: var(--navy); font-size: 12.5pt; padding: 1.6mm 0 1.6mm 8mm; position: relative; border-bottom: 1px solid var(--line); }
  .titres li::before { content: "▸"; position: absolute; left: 1mm; color: var(--blue); }
  .titres li.pick { color: var(--blue); }
  .thumb { font-size: 10.5pt; color: var(--mute); margin: -2mm 0 5mm; }
  .thumb b { color: var(--navy); }
  .intro { background: var(--navy); color: #fff; border-radius: 3mm; padding: 5mm 6mm; margin-bottom: 5mm; font-family: var(--police-titre), sans-serif; font-weight: 700; font-size: 12.5pt; line-height: 1.4; }
  .intro small { display:block; font-family: var(--police-texte), sans-serif; font-weight: 500; font-size: 8.5pt; letter-spacing: .2em; text-transform: uppercase; color:rgba(255,255,255,.72); margin-bottom: 2mm; }
  .intro p { margin: 0 0 2mm; } .intro p:last-child { margin: 0; }
  .intro .fill { background: #FFE58A; color: var(--navy); }
  .tl td { padding: 1.5mm 2.5mm; font-size: 9.5pt; line-height: 1.35; }
  .alt { font-size: 10pt; color: var(--mute); margin: 0 0 1mm; }
  td.t { font-family: var(--police-titre), sans-serif; font-weight: 800; color: var(--blue); white-space: nowrap; width: 22mm; }
  td.rh { color: var(--mute); font-size: 9pt; }
  .bloc { border-left: 3px solid var(--line); padding: 0 0 0 5mm; margin-bottom: 4.5mm; }
  .bloc .bt { font-family: var(--police-titre), sans-serif; font-weight: 800; color: var(--navy); font-size: 12pt; margin-bottom: 1mm; }
  .bloc .bt i { font-style: normal; color: var(--blue); margin-right: 2mm; }
  .bloc ul { margin: 0; padding-left: 5mm; font-size: 10.5pt; line-height: 1.42; }
  .bloc ul li { margin-bottom: .8mm; }
  .rehook { font-size: 10.5pt; color: var(--blue); font-weight: 600; margin-top: 1.2mm; }
  .rehook b, .ctamid b { font-family: var(--police-titre), sans-serif; letter-spacing: .12em; font-size: 7.5pt; text-transform: uppercase; margin-right: 2mm; }
  .ctamid { font-size: 10.5pt; background: var(--tint); border-radius: 2mm; padding: 1.8mm 3.5mm; margin-top: 1.5mm; color: var(--navy); }
  .ctamid b { color: var(--blue); }
  .clips { font-size: 10pt; margin: 0; padding-left: 5mm; }
</style>
%%MARQUE%%
</head>
<body>
%%PAGES%%
<script>
/* Contrôle de débordement : marque les pages dont le texte passe sous les sources ou le pied (lu par build.py via --dump-dom). */
window.addEventListener('load', () => {
  const r = [];
  document.querySelectorAll('.page').forEach((p, i) => {
    const lim = (p.querySelector('.src') || p.querySelector('.foot')).getBoundingClientRect().top;
    let b = 0;
    [...p.children].forEach(c => { if (getComputedStyle(c).position !== 'absolute') b = Math.max(b, c.getBoundingClientRect().bottom); });
    if (b > lim - 4) r.push(i + 1);
  });
  document.body.setAttribute('data-overflow', r.join(','));
});
</script>
</body>
</html>
